# fancontrol configuration file

# Paths to hwmon sysfs entries
temp_input_path = /sys/class/hwmon/hwmon1/temp1_input
# fan_input_path = /sys/class/hwmon/hwmon1/fan1_input
pwm_path = /sys/class/hwmon/hwmon1/pwm1
pwm_enable_path = /sys/class/hwmon/hwmon1/pwm1_enable

# Temperature thresholds in Celsius
temp_min = 40.0
temp_max = 80.0

# PWM output range (0-255)
pwm_min = 64
pwm_max = 255

# Polling interval in milliseconds
poll_interval_ms = 1000
