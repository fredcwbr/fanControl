name: CI Build & Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build Firmware, Daemon & Verify Layouts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-avr avr-libc binutils-avr make python3 python3-pip

      - name: Build AVR Firmware
        run: |
          make -C firmware

      - name: Build Linux Host Daemon
        run: |
          make -C daemon

      - name: Verify Layout Script Syntax & Integrity
        run: |
          python3 -m py_compile lepton/layout_stripboards.py
          python3 -m py_compile docs/templates/generate_templates.py
