# FanControl Linux Daemon Configuration

# Serial device port (created by udev rule or standard ttyUSB)
port = /dev/fancontrol
baud = 115200

# Primary and secondary temperature inputs from /sys/class/hwmon
sensor_cpu = /sys/class/hwmon/hwmon1/temp1_input
sensor_gpu = /sys/class/hwmon/hwmon2/temp1_input

# Fan curve thresholds (in Celsius)
temp_min = 38.0
temp_max = 75.0

# Minimum and maximum PWM outputs (0 - 255)
# pwm_min = 60 is ~24% duty cycle (near silent, avoids fan stall)
pwm_min = 60
pwm_max = 255

# Polling interval in seconds
poll_interval = 1
